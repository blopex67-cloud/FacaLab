name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'sw.js'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bundle web app locally for Android WebView
        run: |
          cd "$GITHUB_WORKSPACE"
          npm install --no-audit --no-fund
          npm run build:android
          python3 - <<'PY'
          from pathlib import Path
          source = Path('index.html').read_text()
          target = source.replace('<script type="module" src="app.js"></script>', '<script src="app.bundle.js"></script>')
          if target == source:
              raise SystemExit('Could not switch Android entry point to bundled local script')
          Path('android/app/src/main/assets/index.html').write_text(target)
          for name in ['style.css', 'manifest.webmanifest', 'icon.svg', 'sw.js']:
              Path('android/app/src/main/assets', name).write_bytes(Path(name).read_bytes())
          PY
      - name: Locate Android SDK tools on runner
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -path '*/bin/sdkmanager' -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found under $SDK_ROOT" >&2
            exit 1
          fi
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Found sdkmanager at $SDKMANAGER"
      - name: Install Android platform
        run: |
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          sdkmanager --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle web app and build APK
        run: gradle -p android --no-daemon --stacktrace :app:assembleDebug
      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FacaLab-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FacaLab Android v1.0.${{ github.run_number }}
          body: |
            APK de prueba de FacaLab. La interfaz Three.js y MediaPipe se empaquetan en la APK; para seguimiento facial se necesita conexión a Internet para descargar el runtime/modelo de MediaPipe.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
