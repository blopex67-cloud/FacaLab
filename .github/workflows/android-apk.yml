name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'sw.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK tools on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager --version
      - name: Install Android platform
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle web app and build APK
        run: gradle -p android --no-daemon --stacktrace :app:assembleDebug
      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FacaLab-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FacaLab Android v1.0.${{ github.run_number }}
          body: |
            APK de prueba de FacaLab.

            Instálala en Android y concede permiso de cámara cuando la app lo solicite. El tracking requiere conexión a Internet para descargar MediaPipe y su modelo.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
